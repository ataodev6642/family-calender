<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>買い物リスト | 家族カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4f1;
    --card: #ffffff;
    --ink: #5b5650;
    --ink-soft: #a49c93;
    --line: #ece6df;

    --pink: #f7c6d0;   --pink-text: #b85c73;
    --mint: #c7e8dc;   --mint-text: #4c8a75;
    --blue: #cddff5;   --blue-text: #5b7fb0;
    --yellow: #f5e6bd; --yellow-text: #ad8b3a;
    --purple: #ded3f0; --purple-text: #8570ad;

    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow: 0 2px 10px rgba(91, 86, 80, 0.06);
    --shadow-hover: 0 6px 18px rgba(91, 86, 80, 0.10);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: 'M PLUS Rounded 1c', sans-serif;
    padding: 24px 16px 60px;
  }
  .app { max-width: 640px; margin: 0 auto; }

  header {
    background: var(--card); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 18px 22px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 18px;
  }
  h1 { font-size: 19px; font-weight: 700; margin: 0; }
  nav.tabs { display: flex; gap: 6px; }
  nav.tabs a {
    font-size: 12.5px; font-weight: 700; text-decoration: none;
    padding: 7px 14px; border-radius: 999px; color: var(--ink-soft);
  }
  nav.tabs a.current { background: var(--pink); color: var(--pink-text); }

  /* --- 追加フォーム --- */
  .add-form {
    background: var(--card); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 18px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .add-form input[type="text"] {
    flex: 1; min-width: 140px;
    padding: 10px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 13.5px; background: var(--bg); color: var(--ink);
  }
  .add-form input[type="number"] {
    width: 64px;
    padding: 10px 8px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 13.5px; background: var(--bg); color: var(--ink); text-align: center;
  }
  .add-form select {
    padding: 10px 10px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 13px; background: var(--bg); color: var(--ink);
  }
  .add-form input:focus, .add-form select:focus { outline: none; border-color: var(--pink); }
  .add-form button {
    border: none; border-radius: 999px; background: var(--mint); color: var(--mint-text);
    font-family: inherit; font-weight: 700; font-size: 13.5px; padding: 0 20px; cursor: pointer;
  }
  .add-form button:hover { opacity: 0.85; }

  /* --- カテゴリーグループ --- */
  .category-group { margin-bottom: 22px; }
  .category-label {
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
    margin: 0 0 8px 4px; display: flex; align-items: center; gap: 6px;
  }
  .category-label .dot { width: 8px; height: 8px; border-radius: 50%; }

  .item-list { display: flex; flex-direction: column; gap: 8px; }

  .item-card {
    background: var(--card); border-radius: var(--radius-md);
    box-shadow: var(--shadow); padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    transition: opacity 0.2s ease;
  }
  .item-card.checked { opacity: 0.45; }

  .check-circle {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--line); flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .item-card.checked .check-circle {
    background: var(--mint); border-color: var(--mint); color: var(--mint-text);
  }

  .item-name { flex: 1; font-size: 14.5px; }
  .item-card.checked .item-name { text-decoration: line-through; }

  .item-qty { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }

  .item-delete {
    background: none; border: none; color: var(--ink-soft);
    font-size: 16px; cursor: pointer; padding: 4px; line-height: 1;
  }
  .item-delete:hover { color: var(--pink-text); }

  .empty-state {
    text-align: center; padding: 50px 20px; color: var(--ink-soft); font-size: 13.5px;
  }

  .footer-actions { text-align: center; margin-top: 10px; }
  .footer-actions button {
    background: none; border: none; color: var(--ink-soft);
    font-size: 12.5px; text-decoration: underline; cursor: pointer; font-family: inherit;
  }

  @media (max-width: 480px) {
    .add-form { flex-direction: column; }
    .add-form input[type="number"], .add-form select { width: 100%; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>買い物リスト</h1>
    <nav class="tabs">
      <a href="calendar.html">カレンダー</a>
      <a href="shopping.html" class="current">買い物</a>
      <a href="todo.html">ToDo</a>
      <a href="wall.html">壁掛け</a>
    </nav>
  </header>

  <div class="add-form">
    <input type="text" id="newItemName" placeholder="商品名を入力（例：牛乳）">
    <input type="number" id="newItemQty" min="1" value="1">
    <select id="newItemCategory">
      <option value="食品">食品</option>
      <option value="日用品">日用品</option>
      <option value="飲み物">飲み物</option>
      <option value="その他">その他</option>
    </select>
    <button id="addBtn">追加</button>
  </div>

  <div id="listContainer"></div>
  <div class="footer-actions" id="footerActions" style="display:none;">
    <button id="clearCheckedBtn">チェック済みをまとめて削除</button>
  </div>
</div>

<script type="module">
  import { auth, db } from "./js/firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    doc, getDoc, collection, onSnapshot,
    addDoc, updateDoc, deleteDoc, query, orderBy, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const $ = (id) => document.getElementById(id);

  const CATEGORY_COLOR = {
    '食品': 'pink', '日用品': 'blue', '飲み物': 'mint', 'その他': 'purple',
  };
  const CATEGORY_ORDER = ['食品', '飲み物', '日用品', 'その他'];

  let familyId = null;
  let items = [];

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (!userDoc.exists() || !userDoc.data().familyId) { window.location.href = 'login.html'; return; }
    familyId = userDoc.data().familyId;
    subscribeItems();
  });

  function itemsCol() {
    return collection(db, 'families', familyId, 'shoppingItems');
  }

  function subscribeItems() {
    const q = query(itemsCol(), orderBy('createdAt', 'asc'));
    onSnapshot(q, (snap) => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, (err) => {
      console.error(err);
      alert('リストの読み込みに失敗しました: ' + err.message);
    });
  }

  function render() {
    const container = $('listContainer');
    if (!items.length) {
      container.innerHTML = '<div class="empty-state">買い物リストは空っぽです。上のフォームから追加してみましょう。</div>';
      $('footerActions').style.display = 'none';
      return;
    }

    const byCategory = {};
    for (const item of items) {
      const cat = item.category || 'その他';
      (byCategory[cat] ||= []).push(item);
    }

    let html = '';
    for (const cat of CATEGORY_ORDER) {
      const catItems = byCategory[cat];
      if (!catItems || !catItems.length) continue;
      // 未チェック→チェック済みの順で並べる
      catItems.sort((a, b) => (a.checked === b.checked) ? 0 : (a.checked ? 1 : -1));
      html += `
        <div class="category-group">
          <div class="category-label">
            <span class="dot" style="background: var(--${CATEGORY_COLOR[cat] || 'purple'})"></span>
            ${escapeHtml(cat)}
          </div>
          <div class="item-list">
            ${catItems.map(renderItem).join('')}
          </div>
        </div>
      `;
    }
    container.innerHTML = html;

    container.querySelectorAll('.check-circle').forEach(el => {
      el.addEventListener('click', () => toggleChecked(el.dataset.id, el.dataset.checked !== 'true'));
    });
    container.querySelectorAll('.item-delete').forEach(el => {
      el.addEventListener('click', () => deleteItem(el.dataset.id));
    });

    $('footerActions').style.display = items.some(i => i.checked) ? 'block' : 'none';
  }

  function renderItem(item) {
    return `
      <div class="item-card ${item.checked ? 'checked' : ''}">
        <div class="check-circle" data-id="${item.id}" data-checked="${item.checked}">${item.checked ? '✓' : ''}</div>
        <div class="item-name">${escapeHtml(item.name)}</div>
        ${item.quantity > 1 ? `<div class="item-qty">×${item.quantity}</div>` : ''}
        <button class="item-delete" data-id="${item.id}" title="削除">×</button>
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function toggleChecked(id, checked) {
    try {
      await updateDoc(doc(itemsCol(), id), { checked });
    } catch (err) {
      alert('更新に失敗しました: ' + err.message);
    }
  }

  async function deleteItem(id) {
    try {
      await deleteDoc(doc(itemsCol(), id));
    } catch (err) {
      alert('削除に失敗しました: ' + err.message);
    }
  }

  $('addBtn').addEventListener('click', addItem);
  $('newItemName').addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(); });

  async function addItem() {
    const name = $('newItemName').value.trim();
    const qty = parseInt($('newItemQty').value, 10) || 1;
    const category = $('newItemCategory').value;
    if (!name) return;

    $('addBtn').disabled = true;
    try {
      await addDoc(itemsCol(), {
        name, quantity: qty, category, checked: false,
        createdAt: new Date().toISOString(),
      });
      $('newItemName').value = '';
      $('newItemQty').value = 1;
      $('newItemName').focus();
    } catch (err) {
      alert('追加に失敗しました: ' + err.message);
    } finally {
      $('addBtn').disabled = false;
    }
  }

  $('clearCheckedBtn').addEventListener('click', async () => {
    const checkedItems = items.filter(i => i.checked);
    if (!checkedItems.length) return;
    if (!confirm(`チェック済みの${checkedItems.length}件を削除しますか？`)) return;
    try {
      const batch = writeBatch(db);
      checkedItems.forEach(i => batch.delete(doc(itemsCol(), i.id)));
      await batch.commit();
    } catch (err) {
      alert('削除に失敗しました: ' + err.message);
    }
  });
</script>

</body>
</html>
