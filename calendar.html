<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家族カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4f1;
    --card: #ffffff;
    --ink: #5b5650;
    --ink-soft: #a49c93;
    --line: #ece6df;

    --pink: #f7c6d0;
    --pink-text: #b85c73;
    --mint: #c7e8dc;
    --mint-text: #4c8a75;
    --blue: #cddff5;
    --blue-text: #5b7fb0;
    --yellow: #f5e6bd;
    --yellow-text: #ad8b3a;
    --purple: #ded3f0;
    --purple-text: #8570ad;

    --today: #fbeee2;
    --today-ring: #f0b9a0;

    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow: 0 2px 10px rgba(91, 86, 80, 0.06);
    --shadow-hover: 0 6px 18px rgba(91, 86, 80, 0.10);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'M PLUS Rounded 1c', sans-serif;
    padding: 24px 16px 60px;
  }

  .app { max-width: 880px; margin: 0 auto; }

  /* --- ヘッダー --- */
  header {
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
  }

  h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
  }

  .month-nav { display: flex; align-items: center; gap: 14px; }

  .month-label {
    font-size: 15px;
    font-weight: 700;
    min-width: 96px;
    text-align: center;
    color: var(--ink);
  }

  button {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  button:active { transform: scale(0.97); }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--bg);
    color: var(--ink-soft);
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: var(--line); }

  .btn-add {
    background: var(--pink);
    color: var(--pink-text);
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
  }
  .btn-add:hover { opacity: 0.85; }

  /* --- 曜日行 --- */
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 6px;
    padding: 0 2px;
  }
  .weekdays span {
    text-align: center;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .weekdays span:first-child { color: var(--pink-text); opacity: 0.8; }
  .weekdays span:last-child { color: var(--blue-text); opacity: 0.8; }

  /* --- カレンダーグリッド --- */
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .day-cell {
    background: var(--card);
    border-radius: var(--radius-md);
    min-height: 84px;
    padding: 8px 7px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .day-cell:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .day-cell.other-month { opacity: 0.4; box-shadow: none; }
  .day-cell.today { background: var(--today); }
  .day-cell.today .day-num {
    background: var(--today-ring);
    color: #fff;
  }

  .day-num {
    font-size: 12.5px;
    font-weight: 700;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  .events { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }

  .event-chip {
    font-size: 10.5px;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
    cursor: pointer;
  }
  .event-chip:hover { filter: brightness(0.96); }
  .event-chip.c-pink   { background: var(--pink);   color: var(--pink-text); }
  .event-chip.c-mint   { background: var(--mint);   color: var(--mint-text); }
  .event-chip.c-blue   { background: var(--blue);   color: var(--blue-text); }
  .event-chip.c-yellow { background: var(--yellow); color: var(--yellow-text); }
  .event-chip.c-purple { background: var(--purple); color: var(--purple-text); }

  .more-label { font-size: 10px; color: var(--ink-soft); padding-left: 8px; }

  /* --- モーダル --- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(91, 86, 80, 0.28);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-hover);
    padding: 24px;
    width: 100%;
    max-width: 360px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 18px;
    color: var(--ink);
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input[type="text"],
  .field input[type="date"],
  .field input[type="time"] {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--pink); }

  .time-row { display: flex; gap: 10px; }
  .time-row .field { flex: 1; }

  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; margin-bottom: 14px; color: var(--ink);
  }

  .swatches { display: flex; gap: 9px; }
  .swatch {
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.selected { border-color: var(--ink-soft); }
  .swatch.c-pink   { background: var(--pink); }
  .swatch.c-mint   { background: var(--mint); }
  .swatch.c-blue   { background: var(--blue); }
  .swatch.c-yellow { background: var(--yellow); }
  .swatch.c-purple { background: var(--purple); }

  .assignee-row { display: flex; gap: 7px; flex-wrap: wrap; }
  .assignee-chip {
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
    background: var(--bg);
    color: var(--ink-soft);
  }
  .assignee-chip.selected {
    border-color: var(--pink);
    background: var(--pink);
    color: var(--pink-text);
  }

  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .btn-save {
    background: var(--mint); color: var(--mint-text);
    flex: 1; padding: 11px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
  }
  .btn-save:hover { opacity: 0.85; }
  .btn-delete {
    background: var(--bg); color: var(--pink-text);
    padding: 11px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
  }
  .btn-cancel {
    background: var(--card); color: var(--ink-soft);
    padding: 11px 14px; border-radius: 999px; font-size: 13px;
  }

  @media (max-width: 560px) {
    .day-cell { min-height: 62px; padding: 6px 5px; }
    .event-chip { font-size: 9px; padding: 2px 6px; }
    h1 { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>家族カレンダー</h1>
    <nav style="display:flex; gap:6px;">
      <a href="calendar.html" style="font-size:12.5px; font-weight:700; text-decoration:none; padding:7px 14px; border-radius:999px; background:var(--pink); color:var(--pink-text);">カレンダー</a>
      <a href="shopping.html" style="font-size:12.5px; font-weight:700; text-decoration:none; padding:7px 14px; border-radius:999px; color:var(--ink-soft);">買い物</a>
      <a href="todo.html" style="font-size:12.5px; font-weight:700; text-decoration:none; padding:7px 14px; border-radius:999px; color:var(--ink-soft);">ToDo</a>
      <a href="wall.html" style="font-size:12.5px; font-weight:700; text-decoration:none; padding:7px 14px; border-radius:999px; color:var(--ink-soft);">壁掛け</a>
    </nav>
    <div class="month-nav">
      <button class="nav-btn" id="prevMonth">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="nav-btn" id="nextMonth">›</button>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="familyLabel" style="font-size:11.5px; color:var(--ink-soft);"></span>
      <button class="btn-add" id="addBtn">＋ 予定を追加</button>
      <button class="nav-btn" id="logoutBtn" title="ログアウト" style="font-size:13px;">⎋</button>
    </div>
  </header>

  <div class="weekdays">
    <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">予定を追加</h2>

    <div class="field">
      <label>タイトル</label>
      <input type="text" id="evTitle" placeholder="例）ピアノのレッスン">
    </div>

    <div class="field">
      <label>日付</label>
      <input type="date" id="evDate">
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="evAllDay">
      <label for="evAllDay" style="margin:0;">終日</label>
    </div>

    <div class="time-row" id="timeRow">
      <div class="field">
        <label>開始</label>
        <input type="time" id="evStart" value="09:00">
      </div>
      <div class="field">
        <label>終了</label>
        <input type="time" id="evEnd" value="10:00">
      </div>
    </div>

    <div class="field">
      <label>色</label>
      <div class="swatches" id="colorSwatches"></div>
    </div>

    <div class="field">
      <label>担当</label>
      <div class="assignee-row" id="assigneeRow"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">キャンセル</button>
      <button class="btn-delete" id="deleteBtn" style="display:none;">削除</button>
      <button class="btn-save" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db } from "./js/firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    doc, getDoc, collection, query, where, onSnapshot,
    addDoc, updateDoc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const $ = (id) => document.getElementById(id);

  const COLORS = [
    { key: 'pink',   label: 'ピンク' },
    { key: 'mint',   label: 'ミント' },
    { key: 'blue',   label: 'ブルー' },
    { key: 'yellow', label: 'イエロー' },
    { key: 'purple', label: 'パープル' },
  ];
  const ASSIGNEES = [
    { key: 'dad',  label: '👨 父' },
    { key: 'mom',  label: '👩 母' },
    { key: 'kid',  label: '👦 子ども' },
    { key: 'all',  label: '👪 家族全員' },
  ];

  let events = [];
  let familyId = null;
  let unsubscribeEvents = null;
  let viewYear, viewMonth;
  let editingId = null;
  let selectedColor = 'pink';
  let selectedAssignee = 'all';

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function init() {
    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    buildSwatches();
    buildAssignees();
    bindEvents();
    render();

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (!userDoc.exists() || !userDoc.data().familyId) {
        window.location.href = 'login.html';
        return;
      }
      familyId = userDoc.data().familyId;

      const familyDoc = await getDoc(doc(db, 'families', familyId));
      if (familyDoc.exists()) {
        const data = familyDoc.data();
        $('familyLabel').textContent = `${data.name} ／ 招待コード: ${data.inviteCode}`;
      }

      subscribeEvents();
    });

    $('logoutBtn').addEventListener('click', () => signOut(auth));
  }

  function subscribeEvents() {
    const q = query(collection(db, 'families', familyId, 'events'));
    unsubscribeEvents = onSnapshot(q, (snapshot) => {
      events = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, (err) => {
      console.error(err);
      alert('予定の読み込みに失敗しました: ' + err.message);
    });
  }

  function buildSwatches() {
    const wrap = $('colorSwatches');
    wrap.innerHTML = '';
    COLORS.forEach(c => {
      const el = document.createElement('div');
      el.className = `swatch c-${c.key}`;
      el.title = c.label;
      el.dataset.color = c.key;
      el.addEventListener('click', () => {
        selectedColor = c.key;
        [...wrap.children].forEach(ch => ch.classList.remove('selected'));
        el.classList.add('selected');
      });
      wrap.appendChild(el);
    });
  }

  function buildAssignees() {
    const wrap = $('assigneeRow');
    wrap.innerHTML = '';
    ASSIGNEES.forEach(a => {
      const el = document.createElement('div');
      el.className = 'assignee-chip';
      el.textContent = a.label;
      el.dataset.assignee = a.key;
      el.addEventListener('click', () => {
        selectedAssignee = a.key;
        [...wrap.children].forEach(ch => ch.classList.remove('selected'));
        el.classList.add('selected');
      });
      wrap.appendChild(el);
    });
  }

  function render() {
    $('monthLabel').textContent = `${viewYear}年 ${viewMonth+1}月`;
    const grid = $('grid');
    grid.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    const today = todayStr();

    const cells = [];
    for (let i = startOffset - 1; i >= 0; i--) {
      cells.push({ day: daysInPrevMonth - i, other: true, dateStr: null });
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells.push({ day: d, other: false, dateStr });
    }
    while (cells.length % 7 !== 0) {
      cells.push({ day: cells.length, other: true, dateStr: null });
    }

    cells.forEach(cell => {
      const div = document.createElement('div');
      div.className = 'day-cell' + (cell.other ? ' other-month' : '') + (cell.dateStr === today ? ' today' : '');
      const dayEvents = cell.dateStr ? events.filter(e => e.date === cell.dateStr) : [];
      const shown = dayEvents.slice(0, 3);
      const extra = dayEvents.length - shown.length;

      div.innerHTML = `
        <div class="day-num">${cell.day}</div>
        <div class="events">
          ${shown.map(e => `<div class="event-chip c-${e.color}" data-event-id="${e.id}">${e.allDay ? '' : escapeHtml(e.start)+' '}${escapeHtml(e.title)}</div>`).join('')}
          ${extra > 0 ? `<div class="more-label">+${extra}件</div>` : ''}
        </div>
      `;
      if (cell.dateStr) {
        div.addEventListener('click', () => openModal(cell.dateStr));
        div.querySelectorAll('.event-chip').forEach(chip => {
          chip.addEventListener('click', (e) => {
            e.stopPropagation();
            openModal(cell.dateStr, chip.dataset.eventId);
          });
        });
      }
      grid.appendChild(div);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function openModal(dateStr, eventId) {
    editingId = eventId || null;
    const ev = eventId ? events.find(e => e.id === eventId) : null;

    $('modalTitle').textContent = ev ? '予定を編集' : '予定を追加';
    $('evTitle').value = ev ? ev.title : '';
    $('evDate').value = ev ? ev.date : dateStr;
    $('evAllDay').checked = ev ? ev.allDay : false;
    $('evStart').value = ev ? (ev.start || '09:00') : '09:00';
    $('evEnd').value = ev ? (ev.end || '10:00') : '10:00';
    $('timeRow').style.display = (ev && ev.allDay) ? 'none' : 'flex';
    $('deleteBtn').style.display = ev ? 'inline-block' : 'none';

    selectedColor = ev ? ev.color : 'pink';
    selectedAssignee = ev ? ev.assignee : 'all';
    [...$('colorSwatches').children].forEach(ch => ch.classList.toggle('selected', ch.dataset.color === selectedColor));
    [...$('assigneeRow').children].forEach(ch => ch.classList.toggle('selected', ch.dataset.assignee === selectedAssignee));

    $('modalBackdrop').classList.add('open');
  }

  function closeModal() {
    $('modalBackdrop').classList.remove('open');
    editingId = null;
  }

  function bindEvents() {
    $('prevMonth').addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      render();
    });
    $('nextMonth').addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      render();
    });
    $('addBtn').addEventListener('click', () => openModal(todayStr()));
    $('cancelBtn').addEventListener('click', closeModal);
    $('modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') closeModal(); });

    $('evAllDay').addEventListener('change', (e) => {
      $('timeRow').style.display = e.target.checked ? 'none' : 'flex';
    });

    $('saveBtn').addEventListener('click', async () => {
      const title = $('evTitle').value.trim();
      const date = $('evDate').value;
      if (!title || !date) { alert('タイトルと日付を入力してください'); return; }

      const data = {
        title, date,
        allDay: $('evAllDay').checked,
        start: $('evStart').value,
        end: $('evEnd').value,
        color: selectedColor,
        assignee: selectedAssignee,
      };

      $('saveBtn').disabled = true;
      try {
        if (editingId) {
          await updateDoc(doc(db, 'families', familyId, 'events', editingId), data);
        } else {
          await addDoc(collection(db, 'families', familyId, 'events'), data);
        }
        closeModal();
        // events は onSnapshot が自動で更新→render() してくれる
      } catch (err) {
        alert('保存に失敗しました: ' + err.message);
      } finally {
        $('saveBtn').disabled = false;
      }
    });

    $('deleteBtn').addEventListener('click', async () => {
      if (!editingId) return;
      if (!confirm('この予定を削除しますか？')) return;
      try {
        await deleteDoc(doc(db, 'families', familyId, 'events', editingId));
        closeModal();
        // events は onSnapshot が自動で更新→render() してくれる
      } catch (err) {
        alert('削除に失敗しました: ' + err.message);
      }
    });
  }

  init();
</script>

</body>
</html>
