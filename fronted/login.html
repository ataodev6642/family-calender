<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ログイン | かぞくカレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4f1;
    --card: #ffffff;
    --ink: #5b5650;
    --ink-soft: #a49c93;
    --line: #ece6df;
    --pink: #f7c6d0;
    --pink-text: #b85c73;
    --mint: #c7e8dc;
    --mint-text: #4c8a75;
    --radius-lg: 20px;
    --radius-sm: 10px;
    --shadow: 0 2px 10px rgba(91, 86, 80, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'M PLUS Rounded 1c', sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
  }
  h1 { font-size: 19px; margin: 0 0 6px; text-align: center; }
  p.sub { font-size: 12.5px; color: var(--ink-soft); text-align: center; margin: 0 0 24px; }

  .tabs { display: flex; background: var(--bg); border-radius: 999px; padding: 4px; margin-bottom: 20px; }
  .tab {
    flex: 1; text-align: center; padding: 8px; border-radius: 999px;
    font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ink-soft);
  }
  .tab.active { background: var(--pink); color: var(--pink-text); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 10px 12px;
    border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 13px; background: var(--bg); color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--pink); }

  button.primary {
    width: 100%; padding: 11px; border: none; border-radius: 999px;
    background: var(--mint); color: var(--mint-text);
    font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    margin-top: 6px;
  }
  button.primary:hover { opacity: 0.85; }
  button.primary:disabled { opacity: 0.5; cursor: default; }

  .error { color: var(--pink-text); font-size: 12px; margin-top: 10px; min-height: 16px; text-align: center; }

  .family-step { display: none; }
  .family-step.active { display: block; }
  .divider { text-align: center; font-size: 11.5px; color: var(--ink-soft); margin: 18px 0; }
  .link-btn {
    background: none; border: none; color: var(--pink-text);
    font-family: inherit; font-size: 12.5px; cursor: pointer; text-decoration: underline;
    display: block; margin: 12px auto 0;
  }
</style>
</head>
<body>

<div class="card">
  <div id="authCard">
    <h1>かぞくカレンダー</h1>
    <p class="sub">家族みんなで使うカレンダーへようこそ</p>

    <div class="tabs">
      <div class="tab active" data-mode="login">ログイン</div>
      <div class="tab" data-mode="signup">新規登録</div>
    </div>

    <div class="field">
      <label>メールアドレス</label>
      <input type="email" id="email" placeholder="example@mail.com">
    </div>
    <div class="field">
      <label>パスワード</label>
      <input type="password" id="password" placeholder="6文字以上">
    </div>

    <button class="primary" id="authBtn">ログイン</button>
    <div class="error" id="authError"></div>
  </div>

  <div id="familyCard" style="display:none;">
    <h1>家族の設定</h1>
    <p class="sub">新しく家族を作るか、招待コードで参加してください</p>

    <div class="field">
      <label>家族の名前（新規作成の場合）</label>
      <input type="text" id="familyName" placeholder="例）田中家">
    </div>
    <button class="primary" id="createFamilyBtn">この名前で家族を作成</button>

    <div class="divider">── または ──</div>

    <div class="field">
      <label>招待コード（すでに家族がある場合）</label>
      <input type="text" id="inviteCode" placeholder="6桁のコード">
    </div>
    <button class="primary" id="joinFamilyBtn">このコードで参加</button>

    <div class="error" id="familyError"></div>
    <button class="link-btn" id="logoutBtn">ログアウトする</button>
  </div>
</div>

<script type="module">
  import { auth, db } from "./js/firebase-config.js";
  import {
    signInWithEmailAndPassword, createUserWithEmailAndPassword,
    onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    doc, getDoc, setDoc, collection, query, where, getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const $ = (id) => document.getElementById(id);
  let mode = 'login';

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      mode = tab.dataset.mode;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      $('authBtn').textContent = mode === 'login' ? 'ログイン' : '新規登録';
      $('authError').textContent = '';
    });
  });

  $('authBtn').addEventListener('click', async () => {
    const email = $('email').value.trim();
    const password = $('password').value;
    $('authError').textContent = '';
    if (!email || password.length < 6) {
      $('authError').textContent = 'メールアドレスと6文字以上のパスワードを入力してください';
      return;
    }
    $('authBtn').disabled = true;
    try {
      if (mode === 'login') {
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        await createUserWithEmailAndPassword(auth, email, password);
      }
      // onAuthStateChanged 側で家族チェックへ進む
    } catch (err) {
      $('authError').textContent = errorMessage(err.code);
    } finally {
      $('authBtn').disabled = false;
    }
  });

  function errorMessage(code) {
    const map = {
      'auth/invalid-email': 'メールアドレスの形式が正しくありません',
      'auth/user-not-found': 'アカウントが見つかりません',
      'auth/wrong-password': 'パスワードが違います',
      'auth/invalid-credential': 'メールアドレスまたはパスワードが違います',
      'auth/email-already-in-use': 'このメールアドレスはすでに登録されています',
      'auth/weak-password': 'パスワードは6文字以上にしてください',
    };
    return map[code] || 'エラーが発生しました。もう一度お試しください';
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      $('authCard').style.display = 'block';
      $('familyCard').style.display = 'none';
      return;
    }
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (userDoc.exists() && userDoc.data().familyId) {
      window.location.href = 'calendar.html';
      return;
    }
    $('authCard').style.display = 'none';
    $('familyCard').style.display = 'block';
  });

  function generateInviteCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  $('createFamilyBtn').addEventListener('click', async () => {
    const name = $('familyName').value.trim();
    $('familyError').textContent = '';
    if (!name) { $('familyError').textContent = '家族の名前を入力してください'; return; }

    const user = auth.currentUser;
    const inviteCode = generateInviteCode();
    const familyRef = doc(collection(db, 'families'));
    try {
      await setDoc(familyRef, { name, inviteCode, createdAt: new Date().toISOString(), createdBy: user.uid });
      await setDoc(doc(db, 'users', user.uid), { familyId: familyRef.id, email: user.email }, { merge: true });
      window.location.href = 'calendar.html';
    } catch (err) {
      $('familyError').textContent = '家族の作成に失敗しました: ' + err.message;
    }
  });

  $('joinFamilyBtn').addEventListener('click', async () => {
    const code = $('inviteCode').value.trim().toUpperCase();
    $('familyError').textContent = '';
    if (!code) { $('familyError').textContent = '招待コードを入力してください'; return; }

    const user = auth.currentUser;
    try {
      const q = query(collection(db, 'families'), where('inviteCode', '==', code));
      const snap = await getDocs(q);
      if (snap.empty) { $('familyError').textContent = 'その招待コードは見つかりませんでした'; return; }
      const familyDoc = snap.docs[0];
      await setDoc(doc(db, 'users', user.uid), { familyId: familyDoc.id, email: user.email }, { merge: true });
      window.location.href = 'calendar.html';
    } catch (err) {
      $('familyError').textContent = '参加に失敗しました: ' + err.message;
    }
  });

  $('logoutBtn').addEventListener('click', () => signOut(auth));
</script>

</body>
</html>
