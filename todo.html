<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ToDo | 家族カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4f1;
    --card: #ffffff;
    --ink: #5b5650;
    --ink-soft: #a49c93;
    --line: #ece6df;

    --pink: #f7c6d0;   --pink-text: #b85c73;
    --mint: #c7e8dc;   --mint-text: #4c8a75;
    --blue: #cddff5;   --blue-text: #5b7fb0;
    --yellow: #f5e6bd; --yellow-text: #ad8b3a;
    --purple: #ded3f0; --purple-text: #8570ad;

    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow: 0 2px 10px rgba(91, 86, 80, 0.06);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: 'M PLUS Rounded 1c', sans-serif;
    padding: 24px 16px 60px;
  }
  .app { max-width: 640px; margin: 0 auto; }

  header {
    background: var(--card); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 18px 22px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 18px;
  }
  h1 { font-size: 19px; font-weight: 700; margin: 0; }
  nav.tabs { display: flex; gap: 6px; }
  nav.tabs a {
    font-size: 12.5px; font-weight: 700; text-decoration: none;
    padding: 7px 14px; border-radius: 999px; color: var(--ink-soft);
  }
  nav.tabs a.current { background: var(--pink); color: var(--pink-text); }

  /* --- 追加フォーム --- */
  .add-form {
    background: var(--card); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 18px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .add-form input[type="text"] {
    flex: 1; min-width: 160px;
    padding: 10px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 13.5px; background: var(--bg); color: var(--ink);
  }
  .add-form input[type="date"] {
    padding: 10px 10px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 13px; background: var(--bg); color: var(--ink);
  }
  .add-form select {
    padding: 10px 10px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 13px; background: var(--bg); color: var(--ink);
  }
  .add-form input:focus, .add-form select:focus { outline: none; border-color: var(--pink); }
  .add-form button {
    border: none; border-radius: 999px; background: var(--mint); color: var(--mint-text);
    font-family: inherit; font-weight: 700; font-size: 13.5px; padding: 0 20px; cursor: pointer;
  }
  .add-form button:hover { opacity: 0.85; }

  /* --- ToDoリスト --- */
  .section-label {
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
    margin: 0 0 8px 4px;
  }
  .todo-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }

  .todo-card {
    background: var(--card); border-radius: var(--radius-md);
    box-shadow: var(--shadow); padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    transition: opacity 0.2s ease;
    border-left: 4px solid transparent;
  }
  .todo-card.priority-high { border-left-color: var(--pink); }
  .todo-card.priority-mid  { border-left-color: var(--yellow); }
  .todo-card.priority-low  { border-left-color: var(--blue); }
  .todo-card.done { opacity: 0.45; }

  .check-circle {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--line); flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .todo-card.done .check-circle {
    background: var(--mint); border-color: var(--mint); color: var(--mint-text);
  }

  .todo-body { flex: 1; min-width: 0; }
  .todo-title { font-size: 14.5px; }
  .todo-card.done .todo-title { text-decoration: line-through; }
  .todo-meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .todo-meta .overdue { color: var(--pink-text); font-weight: 700; }

  .todo-delete {
    background: none; border: none; color: var(--ink-soft);
    font-size: 16px; cursor: pointer; padding: 4px; line-height: 1; flex-shrink: 0;
  }
  .todo-delete:hover { color: var(--pink-text); }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--ink-soft); font-size: 13.5px; }

  @media (max-width: 480px) {
    .add-form { flex-direction: column; }
    .add-form input[type="date"], .add-form select { width: 100%; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>ToDo</h1>
    <nav class="tabs">
      <a href="calendar.html">カレンダー</a>
      <a href="shopping.html">買い物</a>
      <a href="todo.html" class="current">ToDo</a>
      <a href="wall.html">壁掛け</a>
    </nav>
  </header>

  <div class="add-form">
    <input type="text" id="newTodoTitle" placeholder="やることを入力（例：ゴミ出し）">
    <input type="date" id="newTodoDue">
    <select id="newTodoPriority">
      <option value="high">優先度：高</option>
      <option value="mid" selected>優先度：中</option>
      <option value="low">優先度：低</option>
    </select>
    <button id="addBtn">追加</button>
  </div>

  <div class="section-label">未完了</div>
  <div class="todo-list" id="activeList"></div>

  <div class="section-label">完了済み</div>
  <div class="todo-list" id="doneList"></div>
</div>

<script type="module">
  import { auth, db } from "./js/firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    doc, getDoc, collection, onSnapshot,
    addDoc, updateDoc, deleteDoc, query, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const $ = (id) => document.getElementById(id);
  const PRIORITY_ORDER = { high: 0, mid: 1, low: 2 };
  const PRIORITY_LABEL = { high: '優先度高', mid: '優先度中', low: '優先度低' };

  let familyId = null;
  let todos = [];

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (!userDoc.exists() || !userDoc.data().familyId) { window.location.href = 'login.html'; return; }
    familyId = userDoc.data().familyId;
    subscribeTodos();
  });

  function todosCol() {
    return collection(db, 'families', familyId, 'todos');
  }

  function subscribeTodos() {
    const q = query(todosCol(), orderBy('createdAt', 'asc'));
    onSnapshot(q, (snap) => {
      todos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, (err) => {
      console.error(err);
      alert('ToDoの読み込みに失敗しました: ' + err.message);
    });
  }

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function render() {
    const active = todos.filter(t => !t.done)
      .sort((a, b) => (PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]) || (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));
    const done = todos.filter(t => t.done);

    $('activeList').innerHTML = active.length
      ? active.map(renderCard).join('')
      : '<div class="empty-state">未完了のToDoはありません 🎉</div>';

    $('doneList').innerHTML = done.length
      ? done.map(renderCard).join('')
      : '<div class="empty-state">まだ完了したものはありません</div>';

    document.querySelectorAll('.check-circle').forEach(el => {
      el.addEventListener('click', () => toggleDone(el.dataset.id, el.dataset.done !== 'true'));
    });
    document.querySelectorAll('.todo-delete').forEach(el => {
      el.addEventListener('click', () => deleteTodo(el.dataset.id));
    });
  }

  function renderCard(t) {
    const isOverdue = !t.done && t.dueDate && t.dueDate < todayStr();
    return `
      <div class="todo-card priority-${t.priority} ${t.done ? 'done' : ''}">
        <div class="check-circle" data-id="${t.id}" data-done="${t.done}">${t.done ? '✓' : ''}</div>
        <div class="todo-body">
          <div class="todo-title">${escapeHtml(t.title)}</div>
          <div class="todo-meta">
            <span>${PRIORITY_LABEL[t.priority] || ''}</span>
            ${t.dueDate ? `<span class="${isOverdue ? 'overdue' : ''}">${isOverdue ? '期限切れ：' : '期限：'}${formatDate(t.dueDate)}</span>` : ''}
          </div>
        </div>
        <button class="todo-delete" data-id="${t.id}" title="削除">×</button>
      </div>
    `;
  }

  function formatDate(iso) {
    const [y, m, d] = iso.split('-');
    return `${m}/${d}`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function toggleDone(id, done) {
    try {
      await updateDoc(doc(todosCol(), id), { done });
    } catch (err) {
      alert('更新に失敗しました: ' + err.message);
    }
  }

  async function deleteTodo(id) {
    try {
      await deleteDoc(doc(todosCol(), id));
    } catch (err) {
      alert('削除に失敗しました: ' + err.message);
    }
  }

  $('addBtn').addEventListener('click', addTodo);
  $('newTodoTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTodo(); });

  async function addTodo() {
    const title = $('newTodoTitle').value.trim();
    const dueDate = $('newTodoDue').value || null;
    const priority = $('newTodoPriority').value;
    if (!title) return;

    $('addBtn').disabled = true;
    try {
      await addDoc(todosCol(), {
        title, dueDate, priority, done: false,
        createdAt: new Date().toISOString(),
      });
      $('newTodoTitle').value = '';
      $('newTodoDue').value = '';
      $('newTodoTitle').focus();
    } catch (err) {
      alert('追加に失敗しました: ' + err.message);
    } finally {
      $('addBtn').disabled = false;
    }
  }
</script>

</body>
</html>
